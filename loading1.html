<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Underground RP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red: #c0392b;
            --red2: #e74c3c;
            --amber: #e67e22;
            --text: #d0c8b8;
            --dim: #7a6a58;
            --log-ok: #27ae60;
            --log-warn: #e67e22;
            --log-err: #e74c3c;
        }

        body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: #000;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text);
            cursor: none;
        }

        /* ── BACKGROUND ── */
        #bg {
            position: fixed;
            inset: 0;
            background: url('https://themaster1970sf.github.io/loading/4000_7.jpg') center/cover no-repeat;
            filter: brightness(0.18) saturate(0.3) sepia(0.3);
            z-index: 0;
        }

        /* scan lines */
        #scanlines {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.12) 2px,
                rgba(0,0,0,0.12) 4px
            );
            pointer-events: none;
        }

        /* vignette */
        #vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.92) 100%);
            pointer-events: none;
        }

        /* thin red border frame */
        #frame {
            position: fixed;
            inset: 10px;
            border: 1px solid rgba(192,57,43,0.25);
            z-index: 3;
            pointer-events: none;
        }
        #frame::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(192,57,43,0.1);
        }

        /* corner marks */
        .corner {
            position: fixed;
            width: 18px;
            height: 18px;
            z-index: 4;
        }
        .corner.tl { top: 6px; left: 6px;   border-top: 2px solid var(--red); border-left: 2px solid var(--red); }
        .corner.tr { top: 6px; right: 6px;  border-top: 2px solid var(--red); border-right: 2px solid var(--red); }
        .corner.bl { bottom: 6px; left: 6px;  border-bottom: 2px solid var(--red); border-left: 2px solid var(--red); }
        .corner.br { bottom: 6px; right: 6px; border-bottom: 2px solid var(--red); border-right: 2px solid var(--red); }

        /* ── TOP-LEFT LOGO BLOCK ── */
        #header {
            position: fixed;
            top: 28px;
            left: 28px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: fadeIn 1.2s ease both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        #logo-img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(192,57,43,0.5);
            box-shadow: 0 0 24px rgba(192,57,43,0.35);
            display: block;
        }

        #header-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #server-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            letter-spacing: 5px;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 30px rgba(192,57,43,0.7);
        }
        #server-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--red2);
            text-transform: uppercase;
        }

        /* ── STATUS DOTS TOP RIGHT ── */
        #status-panel {
            position: fixed;
            top: 28px;
            right: 28px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 7px;
            animation: fadeIn2 1.2s ease 0.3s both;
        }
        @keyframes fadeIn2 {
            from { opacity: 0; transform: translateX(16px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(200,184,154,0.5);
            text-transform: uppercase;
        }
        .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--log-ok);
            animation: blink 1.6s ease infinite;
        }
        .dot.red  { background: var(--red2); animation-delay: 0.4s; }
        .dot.amber { background: var(--amber); animation-delay: 0.8s; }
        @keyframes blink {
            0%,100% { opacity:1; } 50% { opacity:0.15; }
        }
        #clock {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(200,184,154,0.4);
            margin-top: 4px;
        }

        /* ── BOTTOM LOG BLOCK ── */
        #log-panel {
            position: fixed;
            bottom: 28px;
            left: 28px;
            z-index: 10;
            max-width: 560px;
            animation: fadeUp 1.2s ease 0.5s both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #log-lines {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 16px;
            max-height: 180px;
            overflow: hidden;
        }
        .log-line {
            font-size: 11px;
            letter-spacing: 0.5px;
            line-height: 1.5;
            color: rgba(200,184,154,0.65);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: lineIn 0.3s ease both;
        }
        @keyframes lineIn {
            from { opacity:0; transform: translateX(-8px); }
            to   { opacity:1; transform: translateX(0); }
        }
        .log-line .ok   { color: var(--log-ok); }
        .log-line .warn { color: var(--log-warn); }
        .log-line .err  { color: var(--log-err); }
        .log-line .hi   { color: #fff; }





        /* ── CENTER LOGO ── */
        #center-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: centerFade 1.8s ease 0.4s both;
        }
        @keyframes centerFade {
            from { opacity: 0; transform: translate(-50%, -44%) scale(0.92); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        #center-logo img {
            width: 200px;
            height: 200px;
            border-radius: 28px;
            object-fit: cover;
            border: 1px solid rgba(192,57,43,0.4);
            box-shadow:
                0 0 60px rgba(192,57,43,0.35),
                0 0 120px rgba(192,57,43,0.15);
            display: block;
        }
        .center-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(192,57,43,0.12) 0%, transparent 70%);
            animation: glowPulse 4s ease infinite;
            pointer-events: none;
        }
        @keyframes glowPulse {
            0%,100% { opacity: 0.6; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.1); }
        }
    </style>
</head>

    <div class="corner bl"></div>
    <div class="corner br"></div>

        <div id="header-text">
            <div id="server-name">UNDERGROUND RP</div>
            <div id="server-sub">ПОСТ-АПОКАЛИПСИС &nbsp;·&nbsp; БУНКЕР &nbsp;·&nbsp; DARKRP</div>
        </div>
    </div>

    <!-- TOP RIGHT -->
    <div id="status-panel">
        <div class="status-row"><div class="dot"></div>BUNKER SYSTEMS ONLINE</div>
        <div class="status-row"><div class="dot red"></div>SURFACE ALERT ACTIVE</div>
        <div class="status-row"><div class="dot amber"></div>SECTOR Z CLASSIFIED</div>
        <div id="clock">--:--:--</div>
    </div>

    <!-- BOTTOM LEFT LOG -->
    <div id="log-panel">
        <div id="log-lines"></div>

    </div>



    <script>
        // Clock
        (function tick() {
            const n = new Date();
            document.getElementById('clock').textContent =
                [n.getHours(), n.getMinutes(), n.getSeconds()]
                .map(x => String(x).padStart(2,'0')).join(':');
            setTimeout(tick, 1000);
        })();

        // Log engine
        const logEl = document.getElementById('log-lines');
        const MAX_LINES = 12;
        function addLog(html) {
            const d = document.createElement('div');
            d.className = 'log-line';
            d.innerHTML = html;
            logEl.appendChild(d);
            while (logEl.children.length > MAX_LINES) logEl.removeChild(logEl.firstChild);
        }

        // Simulated startup log
        const bootLog = [
            ['<span class="ok">●</span> Инициализация систем бункера...', 600],
            ['<span class="ok">●</span> Загрузка карты подземного сектора...', 900],
            ['<span class="warn">●</span> Проверка целостности файлов...', 700],
            ['<span class="ok">●</span> Синхронизация с сервером Underground RP...', 1100],
            ['<span class="ok">●</span> Загрузка аддонов сервера...', 800],
            ['<span class="warn">●</span> Применение конфигурации DarkRP...', 650],
            ['<span class="ok">●</span> Подключение к базе данных игроков...', 900],
        ];
        let bi = 0;
        function nextBoot() {
            if (bi < bootLog.length) {
                addLog(bootLog[bi][0]);
                setTimeout(nextBoot, bootLog[bi][1]);
                bi++;
            }
        }
        setTimeout(nextBoot, 500);

        // (progress bar removed)

        // GMod hooks
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, lang, gamemodeNice) {
            document.getElementById('serverName').innerText = servername;
            document.getElementById('serverMap').innerText = 'MAP: ' + mapname;
            document.getElementById('serverGamemode').innerText = 'MODE: ' + (gamemodeNice || gamemode);

        }

        function DownloadingFile(file) {
            addLog('<span class="ok">●</span> Загрузка: <span class="hi">' + file.split('/').pop() + '</span>');
        }

        function SetStatusChanged(status) {
            addLog('<span class="warn">●</span> ' + status);
        }
    </script>
